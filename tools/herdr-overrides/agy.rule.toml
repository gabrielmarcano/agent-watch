# TEMPORARY (agent-watch): Antigravity CLI 1.2.10+ permission dialogs.
# Upstream permission_prompt needs "do you want to proceed?" or "edit command";
# 1.2.10 says "Run this command?" / "Accept this file edit?" and
# "ctrl+g edit/expand command", so the dialog fell back to idle/working.
# Delete this file once `herdr agent explain` shows upstream matching it.
[[rules]]
id = "aw_permission_dialog_1_2"
state = "blocked"
priority = 310
region = "bottom_non_empty_lines(12)"
visible_blocker = true
# A numbered option row (the cursor row starts with ">").
regex = ['(?m)^\s*(?:>\s*)?[1-9]\.\s+\S']
# The dialog footer must be the last two non-empty lines: "↑/↓ Navigate · tab Amend ..." then "esc to cancel ...".
all = [
  { regex = ['(?im)^\s*↑/↓\s+navigate\s+·\s+tab\s+amend\b[^\n]*\n\s*esc to cancel[^\n]*\s*\z'] },
]

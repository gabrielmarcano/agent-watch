# TEMPORARY (agent-watch): a live Claude permission dialog, read only below the
# last horizontal rule. Claude hides its input box while a dialog is open, so the
# dialog is the bottom of the screen. Without this, a stale input box left in the
# visible rows by an earlier Claude run makes live_prompt_box (950) report idle,
# and dialogs without "Esc to cancel" (WebFetch) miss the other blocked rules.
# Delete this file once upstream covers it.
[[rules]]
id = "aw_live_permission_dialog"
state = "blocked"
priority = 990
region = "after_last_horizontal_rule"
visible_blocker = true
# The cursor row of a numbered menu...
line_regex = ['^\s*❯\s*[1-9]\.\s+\S']
# ...in a menu that offers a Yes or a No option.
all = [
  { line_regex = ['(?i)^\s*(?:❯\s*)?[1-9]\.\s*(?:yes|no)\b'] },
]

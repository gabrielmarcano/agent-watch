# Publishes a GitHub release for every push to main, using a date tag
# (vYYYY.MM.DD[.N]) as a snapshot of the whole system.
# Each component keeps its own version (VERSIONS); the release notes list them.
# workflow_dispatch builds the same artifacts without publishing (a dry run).
name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSIONS
      - go.mod
      - go.sum
      - cmd/**
      - pkg/**
      - deploy/launchd/**
      - macos-bar/**
      - herdr-plugin.toml
      - Makefile
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Bridge and relay binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -a; . ./VERSIONS; set +a
          out="$RUNNER_TEMP/dist"; mkdir -p "$out"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version=$BRIDGE_VERSION" -o "$out/agent-watch-bridge" ./cmd/bridge
            tar -C "$out" -czf "$out/agent-watch-bridge_${BRIDGE_VERSION}_${os}_${arch}.tar.gz" agent-watch-bridge
            rm "$out/agent-watch-bridge"
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X main.version=$RELAY_VERSION" -o "$out/agent-watch-relay" ./cmd/relay
            tar -C "$out" -czf "$out/agent-watch-relay_${RELAY_VERSION}_linux_${arch}.tar.gz" agent-watch-relay
            rm "$out/agent-watch-relay"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: ${{ runner.temp }}/dist/*.tar.gz

  menubar:
    name: Menu bar app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and zip
        run: |
          set -a; . ./VERSIONS; set +a
          make bar
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --keepParent bin/AgentWatchBar.app "$RUNNER_TEMP/dist/AgentWatchBar_${MENUBAR_VERSION}_macos_universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: menubar
          path: ${{ runner.temp }}/dist/*.zip

  publish:
    name: Publish the release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, menubar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose release tag
        id: tag
        run: |
          day="$(date -u +%Y.%m.%d)"
          tag="v$day"
          n=2
          while git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; do
            tag="v$day.$n"
            n=$((n + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          set -a; . ./VERSIONS; set +a
          (cd dist && shasum -a 256 ./* > SHA256SUMS)
          prev="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          {
            echo "## Component versions"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Bridge (\`agent-watch-bridge\`) | $BRIDGE_VERSION |"
            echo "| Relay (\`agent-watch-relay\`) | $RELAY_VERSION |"
            echo "| macOS menu bar | $MENUBAR_VERSION |"
            echo "| Wear OS app | $WEAROS_VERSION_NAME ($WEAROS_VERSION_CODE), built from source (see README) |"
            echo
            echo "macOS binaries and the menu bar app are not notarized: after downloading, run \`xattr -d com.apple.quarantine <file>\` (or open the app with right click → Open)."
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then git log --no-merges --format='- %s (%h)' "$prev..$GITHUB_SHA"; else git log --no-merges --format='- %s (%h)' -n 40 "$GITHUB_SHA"; fi
          } > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Agent Watch $tag" --notes-file notes.md dist/*

# Android unit tests, lint and debug builds (the Wear OS app and the phone app),
# only when the Android tree (or a version) changes. Placeholder google-services.json
# files are generated here: the real Firebase config never leaves the owner's machine,
# and push is not exercised by these builds.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "VERSIONS", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "VERSIONS", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.gabriel.agentwatch"}},
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
          cat > mobile/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000001", "android_client_info": {"package_name": "com.gabriel.agentwatch.mobile"}},
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
      - run: ./gradlew --no-daemon :core:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :mobile:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug

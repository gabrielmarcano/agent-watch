android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# The phone compiles against Android 17 (API 37). AGP 8.13 was tested up to 36; the
# warning is only about the plugin's own version, and the AGP bump is a separate change
# (docs/phases/7-android-ux.md § 1). The watch module stays on 36.
android.suppressUnsupportedCompileSdk=37
